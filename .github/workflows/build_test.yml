name: Build test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test_iOS:
    name: Test iOS (${{ matrix.dependency_manager }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        dependency_manager: [swift_package_manager, cocoapods]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable Swift Package Manager
        if: matrix.dependency_manager == 'swift_package_manager'
        run: flutter config --enable-swift-package-manager
      - name: Disable Swift Package Manager
        if: matrix.dependency_manager == 'cocoapods'
        run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - run: cd example; flutter build ios --no-codesign

  test_android:
    name: Test android on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: cd example; flutter build apk 
